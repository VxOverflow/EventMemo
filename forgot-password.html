<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mot de passe oublié — Memora</title>
  </head>
  <body>
    <main>
      <a href="index.html">Memora</a>
      <h1>Mot de passe oublié</h1>
      <p>
        Indiquez votre e-mail ou votre téléphone. Si ce compte existe, un code
        sera envoyé sur WhatsApp.
      </p>
      <p id="form-message" role="alert" hidden></p>
      <form
        id="forgot-password-form"
        action=""
        method="post"
      >
        <label for="identifiant">E-mail ou téléphone</label
        ><input
          id="identifiant"
          name="identifiant"
          autocomplete="username"
          required
        /><button type="submit">Envoyer le code</button>
      </form>
      <a href="login.html">Retour à la connexion</a>
    </main>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
