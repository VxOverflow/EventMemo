<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Inscription — Memora</title>
  </head>
  <body>
    <main>
      <!-- Création d'un compte organisateur avant la vérification WhatsApp. -->
      <a href="index.html">Memora</a>
      <h1>Créer un compte</h1>
      <p id="form-message" role="alert" hidden></p>
      <form id="form-register" action="" method="post">
        <label for="nom">Nom complet</label
        ><input
          id="nom"
          name="nom"
          autocomplete="name"
          maxlength="100"
          required
        /><label for="email">E-mail</label
        ><input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="150"
          required
        /><label for="telephone">Téléphone WhatsApp (pour recevoir directement les qr codes et les liens)</label
        ><input
          id="telephone"
          name="telephone"
          type="tel"
          autocomplete="tel"
          placeholder="+229XXXXXXXX"
          required
        /><label for="mot_de_passe">Mot de passe</label
        ><input
          id="mot_de_passe"
          name="mot_de_passe"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <label for="mot_de_passe">Confirmer le mot de passe</label>
        <input
          id="confirm-mot_de_passe"
          name="confirm-mot_de_passe  "
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />
        <button type="submit">Créer mon compte</button>
      </form>
      <p>Déjà inscrit ? <a href="login.html">Se connecter</a></p>
    </main>
    <!-- Le script valide et transmet les données d'inscription à l'API. -->
    <script src="assets/js/auth.js" defer></script>
  </body>
</html>
