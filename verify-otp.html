<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Vérification — Memora</title>
  </head>
  <body>
    <main>
      <!-- Activation du compte grâce au code reçu par WhatsApp. -->
      <a href="index.html">Memora</a>
      <h1>Vérifiez votre numéro</h1>
      <p>Un code à 6 chiffres vous a été envoyé sur WhatsApp.</p>
      <p id="form-message" role="alert" hidden></p>
      <form id="verify-otp-form" action="" method="post">
        <label for="code">Code de vérification</label
        ><input
          id="code"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          minlength="6"
          maxlength="6"
          required
        /><button>Vérifier le code</button>
      </form>
    </main>
    <!-- Le script transmet le code à l'endpoint de vérification. -->
    <script src="assets/js/otp.js"></script>
  </body>
</html>
