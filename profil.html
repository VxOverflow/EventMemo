<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Profil — Memora</title>
  </head>
  <body>
    <!-- Navigation de l'espace organisateur. -->
    <header>
      <a href="dashboard.html">Memora</a>
      <nav>
        <a href="dashboard.html">Tableau de bord</a
        ><a href="event.html">Événements</a><a href="souvenir.html">Souvenirs</a
        ><a href="profil.html" aria-current="page">Profil</a
        ><button class="theme-toggle" type="button">Thème</button>
      </nav>
    </header>
    <main>
      <!-- Paramètres personnels, apparence et informations d'abonnement. -->
      <h1>Profil et paramètres</h1>
      <p id="form-message" role="alert" hidden></p>
      <section>
        <h2>Informations personnelles</h2>
        <form id="profile-form" action="" method="post">
          <label for="nom">Nom</label
          ><input id="nom" name="nom" maxlength="100" required /><label
            for="email"
            >E-mail</label
          ><input
            id="email"
            name="email"
            type="email"
            maxlength="150"
            required
          /><button>Enregistrer les modifications</button>
        </form>
      </section>
      <section>
        <h2>Modifier le mot de passe</h2>
        <form id="password-form" action="api/users/password.php" method="post">
          <label for="current_password">Mot de passe actuel</label
          ><input
            id="current_password"
            name="current_password"
            type="password"
            autocomplete="current-password"
            required
          /><label for="new_password">Nouveau mot de passe</label
          ><input
            id="new_password"
            name="new_password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          /><button>Modifier le mot de passe</button>
        </form>
      </section>
      <section>
        <h2>Apparence</h2>
        <button class="theme-toggle" type="button">
          Basculer entre le mode clair et sombre
        </button>
      </section>
      <section>
        <h2>Abonnement</h2>
        <p>Plan actuel : <strong id="current-plan">—</strong></p>
        <p id="plan-expiry"></p>
        <a href="tarif.html">Voir les offres</a>
        <div id="billing-history">
          <h3>Historique de facturation</h3>
          <p>Chargement…</p>
        </div>
      </section>
      <button id="logout-button" type="button"><a href="assets/images/logout.webp"></a></button>
      <button id="logout-button" type="button"></button>
    </main>
    <footer>
      
      <h2>Pour toutes vos questions</h2>
      <a href="mailto:contact@livredesouvenirs.fr"><img src="assets//images/mail.webp" alt="Email" class="logo"></a>
      <a href=""><img src="assets/images/insta.webp" alt="Instagram" class="logo"></a>
      <a href=""><img src="assets/images/logo-facebook.webp" alt="Facebook" class="logo"></a>
      <a href=""><img src="assets/images/logo-whatsapp.webp" alt="WhatsApp" class="logo"></a>
      <a href=""><img src="assets/images/tiktok.webp" alt="TikTok" class="logo"></a>
      <br>
      &copy; 2026 Memora
    </footer>
    <!-- Scripts de thème et de gestion du profil. -->
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/profile.js"></script>
  </body>
</html>
