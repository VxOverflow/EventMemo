<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <title>Connexion_Admin — Memora</title>
  </head>
  <body>
    <main>
      <!-- Formulaire réservé aux administrateurs de la plateforme. -->
      <a href="index.html">Memora</a>
      <h1>Connexion - Espace Administrateur</h1>
      <p id="form-message" role="alert" hidden></p>
      
      <form id="login-form" action="" method="post">
        <label for="identifiant">E-mail</label
        ><input
          id="identifiant"
          name="identifiant"
          autocomplete="on"
          required
        /><label for="mot_de_passe">Mot de passe</label
        ><input
          id="mot_de_passe"
          name="mot_de_passe"
          type="password"
          autocomplete="current-password"
          required
        /><button type="submit">Se connecter</button>
      </form>
      <p><a href="../forgot-password.html">Mot de passe oublié ?</a></p>
      <p>
        <a href="../index.html">Retour à l'accueil</a>
      </p>
    </main>
    <!-- À remplacer par le script spécifique au back-office lors de son implémentation. -->
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
