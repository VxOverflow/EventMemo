<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <title>Connexion — Memora</title>
  </head>
  <body>
    <main>
      <!-- Formulaire d'authentification de l'organisateur. -->
      <a href="index.html">Memora</a>
      <h1>Connexion</h1>
      <p id="form-message" role="alert" hidden></p>
      <form id="login-form" action="" method="post">
        <label for="identifiant">E-mail</label
        ><input
          id="identifiant"
          name="identifiant"
          autocomplete="on"
          required
        /><label for="mot_de_passe">Mot de passe</label
        ><input
          id="mot_de_passe"
          name="mot_de_passe"
          type="password"
          autocomplete="current-password"
          required
        /><button type="submit">Se connecter</button>
      </form>
      <p><a href="forgot-password.html">Mot de passe oublié ?</a></p>
      <p>Pas de compte ? <a href="register.html">S'inscrire</a></p>
    </main>
    <!-- Le script gère l'envoi du formulaire vers l'API d'authentification. -->
    <script src="assets/js/auth.js"></script>
  </body>
</html>
